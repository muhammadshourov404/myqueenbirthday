<style>
:root{--ink:#170f24;--plum:#2b1840;--rose:#eaa3b8;--gold:#f6c46d;--cream:#f6ebef;--mute:#b9a6c4}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--plum),var(--ink) 70%) fixed;color:var(--cream);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:18px;line-height:1.95;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#050308;opacity:0;transition:opacity 2.5s ease;pointer-events:none}
body.lights-out::before{opacity:.88}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:0}#fx{z-index:5}
main{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:0 24px;text-align:center}
.stage{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(28px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));transition:opacity 1.5s ease}
.stage.fade{opacity:0}
h1{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:clamp(30px,8.5vw,48px);line-height:1.4}
.sub{color:var(--mute);font-size:16px;max-width:30ch}
.cake{position:relative;width:150px;height:190px;margin:18px 0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;animation:float 3s ease-in-out infinite}
.cake:focus-visible{outline:2px solid var(--gold);outline-offset:10px;border-radius:12px}
.wax{position:absolute;left:50%;bottom:62px;width:16px;height:70px;margin-left:-8px;border-radius:4px;background:linear-gradient(90deg,#f3d6df,#fff4f7 50%,#e7b9c7)}
.wick{position:absolute;left:50%;bottom:130px;width:2px;height:10px;margin-left:-1px;background:#3a2a2a}
.flame{position:absolute;left:50%;bottom:138px;width:22px;height:46px;margin-left:-11px;border-radius:50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 75%,#fff6d6,var(--gold) 55%,#ff9a3c);box-shadow:0 0 40px 14px rgba(246,196,109,.45);transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite;transition:opacity .5s,transform .5s}
.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke{position:absolute;left:50%;bottom:140px;width:6px;height:40px;margin-left:-3px;border-radius:6px;background:linear-gradient(transparent,rgba(255,255,255,.35));opacity:0}
.out .smoke{animation:smoke 1.8s ease-out}
.plate{position:absolute;left:50%;bottom:0;width:150px;height:64px;margin-left:-75px;border-radius:14px 14px 22px 22px;background:linear-gradient(var(--rose) 0 26%,#7a3d62 26%)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wishing .flame{animation:flickFast .4s ease-in-out infinite;box-shadow:0 0 60px 24px rgba(246,196,109,.6)}
@keyframes flickFast{0%,100%{transform:scale(1.05,1) rotate(-5deg)}50%{transform:scale(.88,1.15) rotate(5deg)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(.94,1.08) rotate(2deg)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px) scaleX(3)}}
.count{display:flex;gap:10px;justify-content:center;margin-top:6px}
.count div{min-width:64px;padding:8px 6px;border:1px solid rgba(234,163,184,.35);border-radius:12px}
.count b{display:block;font-family:'Noto Serif Bengali',serif;font-size:26px;line-height:1.3;color:var(--gold)}
.count span{font-size:13px;color:var(--mute)}
.hint{color:var(--gold);font-size:16px;min-height:1.8em}
.suspense-text{font-family:'Noto Serif Bengali',serif;font-size:clamp(24px,6vw,32px);color:var(--gold);opacity:0;visibility:hidden;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);transition:opacity 1.5s,visibility 1.5s;text-align:center;width:100%;pointer-events:none;z-index:10}
.suspense-text.show{opacity:1;visibility:visible;animation:heartPulse 2s infinite}
@keyframes heartPulse{0%,100%{transform:translate(-50%,-50%) scale(.95);text-shadow:0 0 10px rgba(246,196,109,.2)}50%{transform:translate(-50%,-50%) scale(1.05);text-shadow:0 0 25px rgba(246,196,109,.7)}}
/* letter */
#letter{display:none;padding:20vh 0 55vh;text-align:center}
#letter.show{display:block;animation:in 1.6s both}
@keyframes in{from{opacity:0}to{opacity:1}}
.orn{width:56px;height:1px;margin:0 auto 38px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.l{margin:.3em 0;min-height:1.95em}
.gap{height:1.6em}
.h{font-family:'Noto Serif Bengali',serif;color:var(--rose);font-size:21px;line-height:1.8;margin:.5em 0}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sign{font-family:'Noto Serif Bengali',serif;color:var(--gold);font-size:22px;margin-top:2.2em;opacity:0;transition:opacity 2s}
.sign.in{opacity:1}
.again{margin-top:34px;background:none;border:1px solid var(--rose);color:var(--cream);padding:10px 26px;border-radius:30px;font:inherit;font-size:16px;cursor:pointer}
.again:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#letter.done{padding-bottom:10vh}
.more{color:var(--gold);font-size:15px;margin-top:2.6em;opacity:0;transition:opacity 2s}
.more.in{opacity:1}
#moments{display:none;padding:4vh 0 10vh}
#moments.show{display:block}
h2{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:26px;line-height:1.55}
.msub{color:var(--mute);font-size:15px;margin:4px 0 52px}
.tl{position:relative;display:flex;flex-direction:column;gap:64px}
.tl::before{content:"";position:absolute;left:50%;top:-18px;bottom:-18px;width:1px;background:linear-gradient(transparent,rgba(246,196,109,.55) 6%,rgba(246,196,109,.55) 94%,transparent)}
.card{position:relative;z-index:1;text-align:center;background:linear-gradient(160deg,#2c1b42,#20132e);border:1px solid rgba(234,163,184,.3);border-radius:20px;padding:14px 14px 26px;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(26px);transition:opacity 1.3s,transform 1.3s}
.card.in{opacity:1;transform:none}
.card::before{content:"";position:absolute;left:50%;top:-32px;width:11px;height:11px;margin-left:-6px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px var(--gold)}
.ph{position:relative;aspect-ratio:4/5;border-radius:13px;overflow:hidden;background:#150d22;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.contain img{object-fit:contain}
.ph.empty{cursor:default;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#4a2a63,#1b1129)}
.ph.empty::after{content:"কিছু টেকনিক্যাল ক্রটির কারণে ছবিটি লোড হচ্ছে না! দুঃখিত";color:var(--mute);font-size:15px}
.date{font-family:'Noto Serif Bengali',serif;color:var(--gold);font-size:18px;margin-top:18px;line-height:1.6}
.ct{font-family:'Noto Serif Bengali',serif;font-weight:700;font-size:22px;color:var(--rose);margin:2px 0 8px;line-height:1.5}
.cx{font-size:16px;opacity:.92;line-height:1.9;padding:0 6px}
.end{font-family:'Noto Serif Bengali',serif;color:var(--rose);font-size:21px;line-height:1.8;margin-top:72px}
.orn2{font-size:34px;line-height:1.4;padding-top:10px}
.qt{font-family:'Noto Serif Bengali',serif;font-weight:500;font-size:22px;color:var(--cream);margin:10px 0 12px;line-height:1.75}
.cx{margin:.55em 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .ph{aspect-ratio:9/17}
.ph.shot{aspect-ratio:auto;background:none;display:flex;justify-content:center}
.ph.shot img{width:auto;max-width:82%;max-height:70vh;max-height:70svh;height:auto;border-radius:12px;object-fit:initial}
.ph.shot.empty{aspect-ratio:4/5;display:grid}
#letter2{display:none;padding:14vh 0 55vh;text-align:center}
#letter2.show{display:block;animation:in 1.6s both}
#letter2.done{padding-bottom:12vh}
#again{opacity:0;pointer-events:none;transition:opacity 2s}
#again.in{opacity:1;pointer-events:auto}
#lb{position:fixed;inset:0;z-index:20;background:rgba(10,6,18,.94);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
@media (prefers-reduced-motion:reduce){.card{opacity:1;transform:none;transition:none}.cake,.suspense-text.show{animation:none}}
@media (prefers-reduced-motion:reduce){.flame,.caret{animation:none}}
</style>
</head>

<script>
/* ===== বদলানোর জায়গা ===== */
const NAME = "ঝর্ণা", FROM = "তোমার ভালোবাসা সৌরভ", BIRTHDAY = [11, 3]; // মাস, দিন
const SPEED = 95; // প্রতিটি অক্ষরের মাঝের সময় (মিলিসেকেন্ড), বেশি = ধীর
/* লাইনের শুরুতে "# " থাকলে সেটা হাইলাইট হবে, ফাঁকা লাইন = প্যারাগ্রাফ বিরতি */
const LETTER = `৩ নভেম্বর, ২০০৭—
একটা তারিখ, যেটা হয়তো পৃথিবীর ক্যালেন্ডারে আর দশটা দিনের মতোই সাধারণ। কিন্তু আমার কাছে? এই দিনটা আমার পৃথিবীর সবচেয়ে বিশেষ দিনগুলোর একটি। কারণ এই দিনেই জন্মেছিল সেই মানুষটা, যে একদিন আমার কাছে শুধু “একজন মানুষ” হয়ে থাকেনি—ধীরে ধীরে আমার অনুভূতি, আমার ভালো লাগা, আমার শান্তি, আমার হাসি, আমার অভিমান, আমার অপেক্ষা—সবকিছুর সঙ্গে মিশে গেছে।

# শুভ জন্মদিন, আমার "FULLTUSHIE" । 🫶🏻

জানো, তোমাকে কীভাবে ভালোবাসি সেটা হয়তো সুন্দর কোনো সংজ্ঞায় বোঝাতে পারব না। কারণ কিছু অনুভূতি শব্দের চেয়ে অনেক বড় হয়, যা শব্দে কিংবা বর্ণে ব্যাখ্যা করা অসম্ভব । তোমার জন্য আমার অনুভূতিটাও ঠিক তেমন!

কখনো কখনো নিঃশব্দে তোমার কথা মনে পড়া, কখনো অকারণে তোমার একটা মেসেজের অপেক্ষা করা, কখনো তোমার হাসির কথা মনে করে নিজের অজান্তেই হেসে ফেলা—আবার কখনো শুধু মনে হওয়া, “এই মানুষটা ভালো থাকুক… সবসময়।”

তুমি আমার জীবনে কী হয়ে উঠেছ, সেটা হয়তো তুমি নিজেও পুরোপুরি জানো না।

তুমি আমার সেই মানুষ, যার সঙ্গে কথা বললে আমি সময়ের হিসাব হারিয়ে ফেলি।
তুমি আমার সেই অনুভূতি, যাকে ব্যাখ্যা করতে গেলে শব্দ কম পড়ে যায়।
তুমি আমার সেই নাম, যেটা মনে পড়লে হৃদয়ের ভেতরটা অদ্ভুতভাবে নরম হয়ে যায়।
আর তুমি সেই মানুষ, যার সুখের জন্য নিজের অজান্তেই মন থেকে দোয়া চলে আসে - যার জন্য আমি আমার জীবনটি পর্যন্ত দিয়ে দিতে পারি।

আমি জানি না নিয়তি আমাদের জন্য কী লিখে রেখেছে। আমি জানি না আগামী বছরগুলো আমাদের কোথায় নিয়ে যাবে, কোন পথে হাঁটাবে, কতটা কাছে রাখবে কিংবা কতটা দূরে। কিন্তু একটা জিনিস আমি খুব ভালোভাবে জানি—তোমাকে ভালোবাসার এই অনুভূতিটা আমার জীবনের সবচেয়ে সুন্দর অনুভূতিগুলোর একটি।

আমি চাই, তোমার জীবনের প্রতিটি সকাল একটু বেশি সুন্দর হোক।
তোমার প্রতিটি রাত হোক প্রশান্তির।
তোমার প্রতিটি স্বপ্ন পূর্ণতা পাক।
তোমার চোখে হাসি থাকুক, মনে প্রশান্তি থাকুক, আর তোমার চারপাশে থাকুক এমন মানুষ—যারা তোমার হৃদয়ের মূল্য বুঝতে জানে।

জীবন যদি কখনো তোমাকে ক্লান্ত করে দেয়, মনে রেখো—কোথাও একজন মানুষ আছে, যে তোমার হাসিটাকে পৃথিবীর সবচেয়ে সুন্দর জিনিসগুলোর একটি মনে করে। যে তোমার ভালো থাকাকে নিজের ভালো লাগার সঙ্গে জড়িয়ে ফেলেছে। যে হয়তো সবসময় তোমার পাশে থাকতে পারবে না, কিন্তু মন থেকে তোমার জন্য ভালো কিছু চাওয়া কখনো বন্ধ করবে না।

# আর আজ, তোমার জন্মদিনে, আমার কোনো বড় চাওয়া নেই।

শুধু চাই—তুমি সুখী হও।
মন খুলে হাসো।
তোমার স্বপ্নগুলো তোমার নাগালের মধ্যে থাকুক।
আর নিজের প্রতি কখনো অবিচার কোরো না, কখনো নিজেকে কষ্ট দিও না ভুলেও।

কারণ তুমি জানো কি?
এই পৃথিবীতে তোমার মতো একজন মানুষ আছে—এটাই আমার কাছে যথেষ্ট সুন্দর একটা ব্যাপার।

৩ নভেম্বর আমার কাছে শুধু তোমার Birthday নয়।
এটা সেই দিনের স্মৃতি, যেদিন পৃথিবী তোমাকে পেয়েছিল—আর কোনো এক অদ্ভুত সুন্দর সময়ে, আমিও তোমার মতো একজন মানুষকে আমার হৃদয়ের এতটা কাছে পাওয়ার সৌভাগ্য পেয়েছিলাম।

# Happy Birthday, my sweetest BowXan !! 🫶🏻❤️‍🩹

তুমি আমার love,
তুমি আমার feelings,
তুমি আমার emotions,
তুমি আমার happiness,
তুমি আমার weakness,

  bits = bits.filter(b => b.life > 0 && b.y < fc.height + 30);
  for (const b of bits) {
    b.vy += .16; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
    fx.save(); fx.translate(b.x, b.y); fx.rotate(b.r); fx.globalAlpha = Math.min(1, b.life / 60); fx.fillStyle = b.c;
    if (b.h) { fx.font = b.s * 2 + "px serif"; fx.fillText("♥", -b.s, b.s); } else fx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
    fx.restore();
  }
  if (bits.length) requestAnimationFrame(loop); else running = false;
}

/* typewriter */
const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter("bn", {granularity: "grapheme"}) : null;
const chars = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = sleep;
/* ঝর্ণা নিজে স্ক্রল করলে ৫ সেকেন্ড অটো স্ক্রল থেমে থাকবে */
let lastUser = 0;
["wheel", "touchmove"].forEach(ev => addEventListener(ev, () => { lastUser = Date.now(); }, {passive: true}));
const userActive = () => Date.now() - lastUser < 5000;
const follow = el => { if (userActive()) return; const r = el.getBoundingClientRect(); const y = r.bottom + scrollY - innerHeight * .55; if (y > scrollY) scrollTo({top: y, behavior: "smooth"}); };
const goTo = (el, frac) => { if (userActive()) return; const y = el.getBoundingClientRect().top + scrollY - innerHeight * frac; scrollTo({top: Math.max(0, y), behavior: "smooth"}); };

async function typeText(text, box) {
  box.innerHTML = "";
  const caret = document.createElement("span"); caret.className = "caret";
  await wait(1800);
  for (const raw of text.split("\n")) {
    if (!raw.trim()) { const g = document.createElement("div"); g.className = "gap"; box.appendChild(g); await wait(900); continue; }
    const hl = raw.startsWith("# "), p = document.createElement("p");
    p.className = hl ? "l h" : "l";
    const t = document.createElement("span"); p.append(t, caret); box.appendChild(p);
    if (hl) burst(36, .6);
    let i = 0;
    for (const c of chars(hl ? raw.slice(2) : raw)) {
      t.textContent += c;
      if (++i % 14 === 0) follow(p);
      let d = SPEED;
      if (/[,،]/.test(c)) d = SPEED * 4; else if (/[।?!…]/.test(c)) d = SPEED * 8; else if (c === "—") d = SPEED * 5; else if (c === " ") d = SPEED * .8;
      await wait(d);
    }
    follow(p); await wait(hl ? 1500 : 800);
    if (raw.trim() === "...") await wait(3500);
  }
  caret.remove();
}

/* পুরো অনুষ্ঠানের ক্রম: চিঠি → কার্ড (অটো স্ক্রল) → দ্বিতীয় বার্তা → শেষ */
async function runShow() {
  await typeText(LETTER, $("lines"));
  burst(160, .5); setTimeout(() => burst(120, .4), 800);
  $("sign").classList.add("in"); follow($("sign"));
  await sleep(2800);
  await renderMoments();
  $("letter").classList.add("done"); $("more").classList.add("in"); $("moments").classList.add("show");
  await sleep(2000);
  await playMoments();
  await sleep(1800);
  $("letter2").classList.add("show");
  goTo($("letter2"), .1);
  await typeText(LETTER2, $("lines2"));
  burst(200, .5); setTimeout(() => burst(140, .4), 900);
  $("letter2").classList.add("done");
  $("again").classList.add("in"); follow($("again"));
}

function renderMoments() {
  if ($("tl").children.length) return Promise.resolve();
  const ph = (src, t, c) => `<div class="ph ${c}"><img src="${src}" alt="${t}" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('empty');this.remove()"></div>`;
  $("tl").innerHTML = MOMENTS.map(m => {
    const n = m.imgs.length;
    const media = n === 1 ? ph(m.imgs[0], m.title, "shot") : n > 1 ? `<div class="pair">${m.imgs.map(u => ph(u, m.title, "contain")).join("")}</div>` : `<div class="orn2">🤍</div>`;
    return `<article class="card">${media}<p class="date">${m.date}</p><h3 class="ct">${m.title}</h3>${m.quote ? `<p class="qt">${m.quote}</p>` : ""}${m.text.map(t => `<p class="cx">${t}</p>`).join("")}</article>`;
  }).join("");
  // সব ছবি লোড হওয়া পর্যন্ত অপেক্ষা (সর্বোচ্চ ৮ সেকেন্ড), যেন স্ক্রলের হিসাব ঠিক থাকে
  const loads = [...$("tl").querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.addEventListener("load", r); i.addEventListener("error", r); }));
  return Promise.race([Promise.all(loads), sleep(8000)]);
}
async function playMoments() {
  for (const c of document.querySelectorAll(".card")) {
    c.classList.add("in");
    goTo(c, .1);
    await sleep(c.querySelector(".ph") ? 3200 : 1500);
    goTo(c.querySelector(".date"), .22);
    await sleep(2500 + c.innerText.length * 40);
  }
}
$("tl").addEventListener("click", e => {
  const ph = e.target.closest(".ph:not(.empty)"); if (!ph) return;
  $("lbimg").src = ph.querySelector("img").src; $("lb").classList.add("show");
});
$("lb").addEventListener("click", () => $("lb").classList.remove("show"));
addEventListener("keydown", e => { if (e.key === "Escape") $("lb").classList.remove("show"); });
