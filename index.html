:root{--ink:#170f24;--plum:#2b1840;--rose:#eaa3b8;--gold:#f6c46d;--cream:#f6ebef;--mute:#b9a6c4}

main{position:relative;z-index:1;max-width:580px;margin:0 auto;padding:0 24px;text-align:center}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(28px,env(safe-area-inset-top)) 0 max(28px,env(safe-area-inset-bottom));transition:opacity 1s}

.wax{position:absolute;left:50%;bottom:62px;width:16px;height:70px;margin-left:-8px;border-radius:4px;background:linear-gradient(90deg,#f3d6df,#fff4f7 50%,#e7b9c7)}
.wick{position:absolute;left:50%;bottom:130px;width:2px;height:10px;margin-left:-1px;background:#3a2a2a}

.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke{position:absolute;left:50%;bottom:140px;width:6px;height:40px;margin-left:-3px;border-radius:6px;background:linear-gradient(transparent,rgba(255,255,255,.35));opacity:0}
.out .smoke{animation:smoke 1.8s ease-out}
.plate{position:absolute;left:50%;bottom:0;width:150px;height:64px;margin-left:-75px;border-radius:14px 14px 22px 22px;background:linear-gradient(var(--rose) 0 26%,#7a3d62 26%)}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(.94,1.08) rotate(2deg)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px) scaleX(3)}}

.count b{display:block;font-family:'Noto Serif Bengali',serif;font-size:26px;line-height:1.3;color:var(--gold)}
.count span{font-size:13px;color:var(--mute)}
.hint{color:var(--gold);font-size:16px;min-height:1.8em}

.orn{width:56px;height:1px;margin:0 auto 38px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.l{margin:.3em 0;min-height:1.95em}

.sign.in{opacity:1}

.fast{position:fixed;z-index:6;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:none;background:rgba(23,15,36,.75);border:1px solid rgba(234,163,184,.4);color:var(--mute);padding:6px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}

আমি জানি না নিয়তি আমাদের জন্য কী লিখে রেখেছে। আমি জানি না আগামী বছরগুলো আমাদের কোথায় নিয়ে যাবে, কোন পথে হাঁটাবে, কতটা কাছে রাখবে কিংবা কতটা দূরে। কিন্তু একটা জিনিস আমি খুব ভালোভাবে জানি—তোমাকে ভালোবাসার এই অনুভূতিটা আমার জীবনের সবচেয়ে সুন্দর অনুভূতিগুলোর একটি।

জীবন যদি কখনো তোমাকে ক্লান্ত করে দেয়, মনে রেখো—কোথাও একজন মানুষ আছে, যে তোমার হাসিটাকে পৃথিবীর সবচেয়ে সুন্দর জিনিসগুলোর একটি মনে করে। যে তোমার ভালো থাকাকে নিজের ভালো লাগার সঙ্গে জড়িয়ে ফেলেছে। যে হয়তো সবসময় তোমার পাশে থাকতে পারবে না, কিন্তু মন থেকে তোমার জন্য ভালো কিছু চাওয়া কখনো বন্ধ করবে না।

# আর আজ, তোমার জন্মদিনে, আমার কোনো বড় চাওয়া নেই।

কারণ তুমি জানো কি?
এই পৃথিবীতে তোমার মতো একজন মানুষ আছে—এটাই আমার কাছে যথেষ্ট সুন্দর একটা ব্যাপার।

const $ = id => document.getElementById(id);
const bn = n => String(n).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
const now = new Date(), target = new Date(now.getFullYear(), BIRTHDAY[0] - 1, BIRTHDAY[1]);
const open = now >= target || location.search.includes("preview");

$("title").textContent = "শুভ জন্মদিন, " + NAME;
$("sub").textContent = open ? "মোমবাতিতে একটা টোকা দাও, মনে মনে একটা ইচ্ছে করো।" : "একটা ছোট্ট চমক তোমার জন্য অপেক্ষা করছে।";
$("hint").textContent = open ? "👆 মোমবাতি নিভিয়ে ফেলো" : "৩ নভেম্বর এলেই এটা জ্বলে উঠবে";
$("sign").textContent = "ইতি, " + FROM + " ❤️";

if (!open) {
  const tick = () => {
    let d = Math.max(0, target - new Date());
    $("count").innerHTML = [[864e5, "দিন"], [36e5, "ঘণ্টা"], [6e4, "মিনিট"], [1e3, "সেকেন্ড"]].map(([ms, l]) => {
      const v = Math.floor(d / ms); d -= v * ms; return `<div><b>${bn(v)}</b><span>${l}</span></div>`;
    }).join("");
    if (target - new Date() <= 0) location.reload();
  };
  tick(); setInterval(tick, 1000);
}

/* stars */
const sc = $("stars"), sx = sc.getContext("2d"); let stars = [];
function sizeStars() { sc.width = innerWidth; sc.height = innerHeight; stars = Array.from({length: Math.min(110, innerWidth / 5)}, () => ({x: Math.random() * sc.width, y: Math.random() * sc.height, r: Math.random() * 1.3 + .3, p: Math.random() * 6})); }
function drawStars(t) { sx.clearRect(0, 0, sc.width, sc.height); for (const s of stars) { sx.globalAlpha = .35 + .35 * Math.sin(t / 900 + s.p); sx.fillStyle = "#fff"; sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 7); sx.fill(); } if (!still) requestAnimationFrame(drawStars); }
sizeStars(); addEventListener("resize", sizeStars); requestAnimationFrame(drawStars);

/* confetti + hearts */
const fc = $("fx"), fx = fc.getContext("2d"); let bits = [], running = false;
const sizeFx = () => { fc.width = innerWidth; fc.height = innerHeight; }; sizeFx(); addEventListener("resize", sizeFx);
const cols = ["#f6c46d", "#eaa3b8", "#fff4f7", "#c77dff", "#ff8fa3"];
function burst(n, y = .42) {
  if (still) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = Math.random() * 9 + 3; bits.push({x: fc.width / 2, y: fc.height * y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, s: Math.random() * 8 + 5, c: cols[i % 5], r: Math.random() * 6, vr: Math.random() * .3 - .15, h: Math.random() < .4, life: 260}); }
  if (!running) { running = true; requestAnimationFrame(loop); }
}
function loop() {
  fx.clearRect(0, 0, fc.width, fc.height);
  bits = bits.filter(b => b.life > 0 && b.y < fc.height + 30);
  for (const b of bits) {
    b.vy += .16; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life--;
    fx.save(); fx.translate(b.x, b.y); fx.rotate(b.r); fx.globalAlpha = Math.min(1, b.life / 60); fx.fillStyle = b.c;
    if (b.h) { fx.font = b.s * 2 + "px serif"; fx.fillText("♥", -b.s, b.s); } else fx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
    fx.restore();
  }
  if (bits.length) requestAnimationFrame(loop); else running = false;
}

/* typewriter */
const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter("bn", {granularity: "grapheme"}) : null;
const chars = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let fast = false, run = 0;
const wait = ms => sleep(fast ? ms / 8 : ms);
const follow = el => { const r = el.getBoundingClientRect(); const y = r.bottom + scrollY - innerHeight * .55; if (y > scrollY) scrollTo({top: y, behavior: "smooth"}); };

async function typeLetter() {
  const id = ++run, box = $("lines"); box.innerHTML = "";
  $("sign").classList.remove("in"); $("again").classList.remove("in");
  const caret = document.createElement("span"); caret.className = "caret";
  await wait(1800);
  for (const raw of LETTER.split("\n")) {
    if (id !== run) return;
    if (!raw.trim()) { const g = document.createElement("div"); g.className = "gap"; box.appendChild(g); await wait(900); continue; }
    const hl = raw.startsWith("# "), p = document.createElement("p");
    p.className = hl ? "l h" : "l";
    const t = document.createElement("span"); p.append(t, caret); box.appendChild(p);
    if (hl) burst(36, .6);
    let i = 0;
    for (const c of chars(hl ? raw.slice(2) : raw)) {
      if (id !== run) return;
      t.textContent += c;
      if (++i % 14 === 0) follow(p);
      let d = SPEED;
      if (/[,،]/.test(c)) d = SPEED * 4; else if (/[।?!…]/.test(c)) d = SPEED * 8; else if (c === "—") d = SPEED * 5; else if (c === " ") d = SPEED * .8;
      await wait(d);
    }
    follow(p); await wait(hl ? 1500 : 800);
  }
  caret.remove(); burst(160, .5); setTimeout(() => burst(120, .4), 800);
  $("sign").classList.add("in"); follow($("sign")); $("fast").style.display = "none";
  await sleep(2200); $("again").classList.add("in"); follow($("again"));
}

/* the moment */
const cake = $("cake");
$("cake").addEventListener("click", () => {
  if (!open) { $("hint").textContent = "আর একটু ধৈর্য ধরো, ঝর্ণা 🤍"; return; }
  if (cake.classList.contains("out")) return;
  cake.classList.add("out"); $("hint").textContent = "তোমার ইচ্ছেটা পূর্ণ হোক ✨";
  burst(170); setTimeout(() => burst(110), 700);
  setTimeout(() => $("stage").classList.add("fade"), 1500);
  setTimeout(() => {
    $("stage").style.display = "none"; $("letter").classList.add("show"); scrollTo(0, 0);
    $("fast").style.display = "block"; typeLetter();
  }, 2700);
});
$("fast").addEventListener("click", () => { fast = !fast; $("fast").textContent = fast ? "ধীরে পড়ো" : "দ্রুত পড়ো"; });
$("again").addEventListener("click", () => location.reload());
</script>
